[workspace]
resolver = "2"
members = [
    "crates/zt-node",
    "crates/zt-crypto",
    "crates/zt-controller",
    "crates/zt-legacy",
    "crates/zt-agent",
    "crates/zt-testvectors",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MPL-2.0"

[workspace.dependencies]
zt-crypto = { path = "crates/zt-crypto" }

# Cryptographic primitives. All from RustCrypto; no hand-rolled primitives.
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
chacha20poly1305 = { version = "0.10", features = ["std"] }
hkdf = "0.12"
sha2 = "0.10"
blake3 = "1.5"
rand = "0.8"
rand_core = "0.6"
subtle = "2.5"
zeroize = { version = "1.7", features = ["derive"] }

# Post-quantum primitives (NIST FIPS 203 / FIPS 204).
# Note: these use rand_core 0.10, which is incompatible with the rand 0.8
# line used elsewhere. The two RNG worlds are kept strictly separate:
# `rand` (0.8) for the classical side, `rand_pq` (0.10) for the PQ side.
ml-kem = { version = "0.3", features = ["getrandom", "zeroize"] }
ml-dsa = { version = "0.1", features = ["getrandom"] }
rand_core_pq = { package = "rand_core", version = "0.10" }
rand_pq = { package = "rand", version = "0.10", features = ["std", "std_rng"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
base64 = "0.22"

# Testing
proptest = "1.4"
criterion = "0.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
