<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#151517" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="ZT-next self-hosted overlay network console" />
    <title>ZT-next Console</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script>
      try {
        var theme = localStorage.getItem('zt-next-console-theme') ||
          (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
      } catch (_) {}
    </script>
    <style>
      html, body, #root { min-height: 100%; }
      body {
        margin: 0;
        background: #f5f5f7;
        color: #1d1d1f;
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
      }
      html[data-theme='dark'], html[data-theme='dark'] body { background: #151517; color: #f5f5f7; }
      .boot { min-height: 100vh; display: grid; place-items: center; color: #6e6e73; font: 12px ui-monospace, monospace; }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot">Starting ZT-next console…</div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
