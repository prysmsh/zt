[package]
name = "zt-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Node agent for ZT-next: enrollment, credential renewal, and membership"

[dependencies]
zt-crypto = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
zt-controller = { path = "../zt-controller" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
axum = { version = "0.8" }
