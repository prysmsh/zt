[package]
name = "zt-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Node agent for ZT-next: enrollment, credential renewal, and membership"

[dependencies]
zt-crypto = { workspace = true }
zt-node = { path = "../zt-node" }
zt-tun = { path = "../zt-tun" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
rand = "0.8"
# A blocking HTTP client with TLS, so the agent can reach a controller
# behind a reverse proxy.
ureq = { version = "2", default-features = false, features = ["tls", "json"] }

[dev-dependencies]
tempfile = "3"
zt-controller = { path = "../zt-controller" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
axum = { version = "0.8" }
