[package]
name = "zt-controller"
description = "ZT-next control plane: networks, nodes, policies, relays, and credential issuance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
zt-crypto.workspace = true
axum = { version = "0.8", features = ["macros"] }
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
rand.workspace = true
sha2.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "fs"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.37", features = ["bundled", "serde_json", "chrono"] }
thiserror = "2"
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"
