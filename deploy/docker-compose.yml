# The ZT-next control plane.
#
# The controller is the API and the source of truth. It is not published to
# the host directly: Caddy terminates TLS and proxies to it over the compose
# network, so the controller never sees a public socket.
#
# Authentication is mandatory here. The controller refuses to start without an
# OIDC provider unless it is bound to loopback, so a misconfiguration cannot
# expose the master console.

services:
  controller:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        BINARY: zt-controller
    restart: unless-stopped
    environment:
      ZT_CONTROLLER_LISTEN: 0.0.0.0:8080
      ZT_CONTROLLER_DATA_DIR: /var/lib/zt-next
      # The OIDC provider. The JWKS endpoint is discovered from the issuer
      # when ZT_OIDC_JWKS is not set.
      ZT_OIDC_ISSUER: ${ZT_OIDC_ISSUER:-https://auth.prysm.sh/oidc}
      ZT_OIDC_AUDIENCE: ${ZT_OIDC_AUDIENCE:-zt-console-app-001}
      ZT_OIDC_OPERATOR_ROLE: ${ZT_OIDC_OPERATOR_ROLE:-zt:operator}
      ZT_OIDC_TENANT_SCOPE: ${ZT_OIDC_TENANT_SCOPE:-zt:tenant}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - controller-data:/var/lib/zt-next
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/v1/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # The console. It is a static bundle served by Caddy, which also proxies
  # the API under /api so the browser sees a single origin.
  console:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.console
      args:
        # The origin the browser reaches the console at. It has to match the
        # redirect URI registered with the OIDC provider.
        VITE_ZT_PUBLIC_ORIGIN: ${ZT_PUBLIC_ORIGIN:-}
        VITE_ZT_PUBLIC_SCHEME: ${ZT_PUBLIC_SCHEME:-https}
        VITE_ZT_OIDC_ISSUER: ${ZT_OIDC_ISSUER:-https://auth.prysm.sh/oidc}
        VITE_ZT_OIDC_CLIENT_ID: ${ZT_OIDC_CLIENT_ID:-zt-console-app-001}
        VITE_ZT_OIDC_AUDIENCE: ${ZT_OIDC_AUDIENCE:-zt-console-app-001}
    restart: unless-stopped
    expose:
      - "80"

  caddy:
    # The name matters: the Verity stack's Caddy routes the console's
    # hostname to this service by name, over the shared network.
    container_name: zt-caddy
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      controller:
        condition: service_healthy
      console:
        condition: service_started
    environment:
      ZT_LISTEN_PORT: ${ZT_LISTEN_PORT:-80}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      # The host's ports 80 and 443 are already held by the Verity stack, so
      # the console is published on its own port. Put it behind the existing
      # reverse proxy, or point a hostname at it directly.
      - "${ZT_HTTP_PORT:-8080}:80"
    networks:
      - default
      # The Verity stack's network, so the Caddy that terminates TLS for
      # auth.prysm.sh can also route zt.hardening.dev here.
      - verity

networks:
  verity:
    external: true
    name: ${ZT_VERITY_NETWORK:-verity-deploy_default}

volumes:
  controller-data:
  caddy-data:
  caddy-config:
