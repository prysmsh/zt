# The console's static server.
#
# A single-page application: any path that is not a file falls back to
# index.html, so a deep link works on a reload.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset filenames, so they can be cached hard. A missing one
    # must not be cached: the browser would keep the failure long after
    # the asset was there.
    location /console/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The console lives under /console. The landing page is the front
    # door, and the Caddy in front routes between the two.
    location = /console {
        return 301 /console/;
    }

    # The console's pages. The entry point must not be cached, or a deploy
    # would not take effect: the browser would keep the old page, and with
    # it the old bundle.
    location /console/ {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /console/index.html;
    }

    # The entry point must not be cached, or a deploy would not take effect.
    location = /console/index.html {
        add_header Cache-Control "no-store" always;
    }

    # The API is proxied by Caddy, not by nginx, so the browser sees one
    # origin. This block only rejects direct API calls that skip Caddy.
    location /api/ {
        return 404;
    }

    # Nothing else is served here. The landing page has its own server.
    location / {
        return 404;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
