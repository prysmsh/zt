# The console's static server.
#
# A single-page application: any path that is not a file falls back to
# index.html, so a deep link works on a reload.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset filenames, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The entry point must not be cached, or a deploy would not take effect.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The API is proxied by Caddy, not by nginx, so the browser sees one
    # origin. This block only rejects direct API calls that skip Caddy.
    location /api/ {
        return 404;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
