# The landing page's static server.
#
# The console is served from /console by its own server, and the landing
# page is served from /landing by this one. The Caddy in front routes
# between them, so the two never share a path.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The landing page's own files. Their names carry a content hash, so
    # they can be cached for good — and nothing stale is ever served.
    location /landing/ {
        try_files $uri $uri/ =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    location = /landing {
        return 301 /landing/;
    }

    # The page itself. It is small and it changes, so it is not cached.
    location = / {
        add_header Cache-Control "no-store" always;
        try_files /index.html =404;
    }

    location / {
        return 404;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
